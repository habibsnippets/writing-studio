# ============================================================
# Desktop release.
#
# Push a version tag that matches package.json ("v1.2.0" for 1.2.0)
# and each platform builds its own installers. electron-builder then
# attaches them to the GitHub release for that tag, creating a draft
# release if none exists yet.
#
#   git tag v1.1.0
#   git push origin v1.1.0
#
# `--publish always` is the documented electron-builder approach and
# needs GH_TOKEN plus `contents: write`. No third-party action is
# involved; the build command is the same one that runs locally.
# ============================================================

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One runner at a time: on the very first release all three jobs would
      # otherwise race to create the same draft release and one could 422.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            command: npx electron-builder --linux --x64 --publish always
          - os: windows-latest
            command: npx electron-builder --win --x64 --publish always
          - os: macos-latest
            command: npx electron-builder --mac --x64 --arm64 --publish always

    steps:
      - uses: actions/checkout@v4

      # Node 22 rather than 20: electron-builder's dependency tree now
      # declares >=22.12 for some packages (npm warns EBADENGINE on 20).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      # electron-builder publishes to v<package.json version>; a tag that
      # disagrees would spread a broken release across three runners.
      - name: Check tag matches package.json
        run: node scripts/check-release-tag.mjs

      # The rpm target needs rpm tooling on the runner.
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # An empty CSC_LINK is read as a certificate path, so export only the
      # variables that actually hold a value: without the secrets the build
      # stays unsigned exactly as before, with them it signs and notarizes.
      - name: Configure code signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          emit() { if [ -n "${2:-}" ]; then printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; fi; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "${MAC_CSC_LINK:-}" ]; then
              emit CSC_LINK "$MAC_CSC_LINK"
              emit CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
              # Notarization needs all three; a partial set would fail the build.
              if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
                emit APPLE_ID "$APPLE_ID"
                emit APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
                emit APPLE_TEAM_ID "$APPLE_TEAM_ID"
              fi
            else
              # Unsigned build: stop electron-builder hunting for an identity.
              printf 'CSC_IDENTITY_AUTO_DISCOVERY=false\n' >> "$GITHUB_ENV"
            fi
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "${WIN_CSC_LINK:-}" ]; then
            emit WIN_CSC_LINK "$WIN_CSC_LINK"
            emit WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
          fi

      - name: Build and publish installers
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder always creates a draft, and drafts are invisible to
  # releases/latest — the link every download button on the site uses.
  # Publish only after every platform has uploaded, so nobody can download
  # a release that is still missing installers.
  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
